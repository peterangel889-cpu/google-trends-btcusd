<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC Search Watch</title>
<style>
  :root {
    --bg: #0e1015; --panel: #161921; --line: #262a35; --text: #e8e9ec; --muted: #8b90a0;
    --orange: #f7931a; --blue: #5b9cf6; --price: #d9dbe1;
    --calm: #3fb27f; --warm: #e0b341; --hot: #ef5b5b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .card .v { font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card .n { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .status .v.calm { color: var(--calm); } .status .v.warm { color: var(--warm); } .status .v.hot { color: var(--hot); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 8px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; color: var(--muted); border: 0; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button.on { background: var(--line); color: var(--text); }
  .chart { position: relative; height: 420px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .warn { background: #3a2a12; border: 1px solid #6b4a17; color: #f3cf8e; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-size: 13px; display: none; }
  @media (max-width: 620px) {
    .cards { grid-template-columns: 1fr 1fr; }
    .cards .status { grid-column: 1 / -1; }
    .chart { height: 340px; }
  }
</style>
</head>
<body>
<main>
  <h1>BTC Search Watch</h1>
  <p class="sub">Google searches vs bitcoin price · worldwide, weekly</p>

  <div class="warn" id="warn"></div>

  <div class="cards">
    <div class="card status"><div class="k">Search spike check</div><div class="v" id="status">–</div><div class="n" id="statusNote"></div></div>
    <div class="card"><div class="k">BTC price</div><div class="v" id="price">–</div><div class="n" id="priceNote"></div></div>
    <div class="card"><div class="k">"bitcoin" searches</div><div class="v" id="latest">–</div><div class="n" id="latestNote"></div></div>
  </div>

  <div class="panel">
    <div class="bar">
      <div class="legend">
        <span><i style="background:var(--orange)"></i>"bitcoin" searches</span>
        <span><i style="background:var(--blue)"></i>"buy bitcoin" searches</span>
        <span><i style="background:var(--price)"></i>BTC price (right axis)</span>
      </div>
      <div class="seg" id="range">
        <button data-d="90">3M</button><button data-d="182">6M</button><button data-d="366" class="on">1Y</button>
      </div>
    </div>
    <div class="chart"><canvas id="c"></canvas></div>
  </div>

  <p class="foot" id="foot"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const usd = n => "$" + Math.round(n).toLocaleString("en-US");
  const fmtDate = d => d.toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" });

  let data;
  try {
    const r = await fetch("data/trends.json?v=" + Date.now(), { cache: "no-store" });
    data = await r.json();
  } catch (e) {
    $("warn").style.display = "block";
    $("warn").textContent = "No search data yet. Run the \"Update search data\" job once from the Actions tab on GitHub.";
    return;
  }

  // Stale-data warning
  const updated = new Date(data.updated);
  const ageDays = (Date.now() - updated) / 864e5;
  if (ageDays > 3) {
    $("warn").style.display = "block";
    $("warn").textContent = `Search data is ${Math.floor(ageDays)} days old. The update job may have failed. Rerun it from the Actions tab on GitHub.`;
  }

  // Price series: saved history plus a live price if available
  const price = data.price.map(([t, p]) => ({ x: t * 1000, y: p }));
  try {
    const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true");
    const j = await r.json();
    const live = j.bitcoin.usd;
    price.push({ x: Date.now(), y: live });
    const ch = j.bitcoin.usd_24h_change;
    $("price").textContent = usd(live);
    $("priceNote").textContent = `Live · ${ch >= 0 ? "+" : ""}${ch.toFixed(1)}% 24h`;
  } catch (e) {
    const last = price[price.length - 1];
    if (last) { $("price").textContent = usd(last.y); $("priceNote").textContent = "Live price unavailable · last saved"; }
  }

  // Search series
  const [t1, t2] = data.terms;
  const s1 = data.trends.map(r => ({ x: r.t * 1000, y: r[t1], partial: r.partial }));
  const s2 = data.trends.map(r => ({ x: r.t * 1000, y: r[t2], partial: r.partial }));

  // Spike status
  const sp = data.spike;
  if (sp) {
    let cls = "calm", label = "Calm";
    if (sp.ratio >= 2) { cls = "hot"; label = "Spike"; }
    else if (sp.ratio >= 1.5) { cls = "warm"; label = "Warming"; }
    $("status").textContent = `${label} · ${sp.ratio.toFixed(1)}×`;
    $("status").className = "v " + cls;
    $("statusNote").textContent = `Last full week vs 8-week average (${sp.baseline}). Spike = 2× or more.`;
    $("latest").textContent = sp.latest;
    $("latestNote").textContent = "Last full week, 0–100 scale";
  }

  // Chart
  Chart.defaults.color = "#8b90a0";
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  const grid = "#232733";
  const chart = new Chart($("c"), {
    type: "line",
    data: { datasets: [
      { label: `"${t1}" searches`, data: s1, yAxisID: "s", borderColor: "#f7931a", borderWidth: 2, pointRadius: 0, tension: .25,
        segment: { borderDash: c => c.p1.raw.partial ? [4, 4] : undefined } },
      { label: `"${t2}" searches`, data: s2, yAxisID: "s", borderColor: "#5b9cf6", borderWidth: 2, pointRadius: 0, tension: .25,
        segment: { borderDash: c => c.p1.raw.partial ? [4, 4] : undefined } },
      { label: "BTC price", data: price, yAxisID: "p", borderColor: "#d9dbe1", borderWidth: 1.4, pointRadius: 0, tension: .1 },
    ]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          title: items => fmtDate(new Date(items[0].parsed.x)),
          label: i => i.dataset.yAxisID === "p" ? ` BTC ${usd(i.parsed.y)}` : ` ${i.dataset.label}: ${i.parsed.y}${i.raw.partial ? " (partial week)" : ""}`,
        }},
      },
      scales: {
        x: { type: "time", time: { unit: "month", tooltipFormat: "d MMM yyyy" }, grid: { color: grid } },
        s: { position: "left", min: 0, max: 100, grid: { color: grid }, title: { display: true, text: "Search interest (0–100)" } },
        p: { position: "right", grid: { display: false },
             ticks: { maxTicksLimit: 7, callback: v => "$" + (v >= 1000 ? (v / 1000).toFixed(v < 10000 ? 1 : 0) + "k" : v) } },
      },
    },
  });

  // Range buttons
  function setRange(days) {
    const min = Date.now() - days * 864e5;
    chart.options.scales.x.min = min;
    chart.options.scales.x.time.unit = days <= 100 ? "week" : "month";
    const vis = price.filter(p => p.x >= min).map(p => p.y);
    chart.options.scales.p.suggestedMin = Math.min(...vis) * 0.97; chart.options.scales.p.min = undefined;
    chart.options.scales.p.suggestedMax = Math.max(...vis) * 1.02; chart.options.scales.p.max = undefined;
    chart.update();
    document.querySelectorAll("#range button").forEach(b => b.classList.toggle("on", +b.dataset.d === days));
    try { localStorage.setItem("range", days); } catch (e) {}
  }
  document.querySelectorAll("#range button").forEach(b => b.onclick = () => setRange(+b.dataset.d));
  let saved = 366; try { saved = +localStorage.getItem("range") || 366; } catch (e) {}
  setRange(saved);

  $("foot").textContent = `Search data updated ${fmtDate(updated)}. Both search terms share one 0–100 scale (100 = busiest week for either term in the past year). Dashed line = current partial week. Sources: Google Trends via SerpApi, CoinGecko.`;
})();
</script>
</body>
</html>
